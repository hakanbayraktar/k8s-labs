apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-web
  template:
    metadata:
      labels:
        app: notes-web
    spec:
      containers:
        - name: web
          image: notes-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: notes-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: notes-db, key: MYSQL_PASSWORD }
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          readinessProbe:          # veritabani yoksa trafik alma
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:           # surec kilitlenirse yeniden baslat
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notes-web
spec:
  type: NodePort
  selector:
    app: notes-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30088
