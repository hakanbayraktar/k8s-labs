apiVersion: v1
kind: Pod
metadata:
  name: init-container-pod
  labels:
    app: init-demo
spec:
  initContainers:
    - name: wait-for-cache
      image: busybox:1.37
      command: ['sh', '-c', 'until nc -z cache-svc 6379; do echo "cache-svc bekleniyor"; sleep 2; done; echo "cache-svc hazir"']
    - name: setup-page
      image: busybox:1.37
      command: ['sh', '-c', 'echo "<h1>Init Container tarafindan hazirlandi</h1>" > /workdir/index.html']
      volumeMounts:
        - name: shared-data
          mountPath: /workdir
  containers:
    - name: web
      image: nginx:1.30-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
  volumes:
    - name: shared-data
      emptyDir: {}
