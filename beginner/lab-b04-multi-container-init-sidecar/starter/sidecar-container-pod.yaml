apiVersion: v1
kind: Pod
metadata:
  name: sidecar-container-pod
  labels:
    app: sidecar-demo
spec:
  initContainers:
    # restartPolicy: Always olan init container yerlesik sidecar'dir:
    # ana container'dan once baslar ve Pod boyunca calismaya devam eder.
    - name: log-sidecar
      image: busybox:1.37
      restartPolicy: Always
      command: ['sh', '-c', 'touch /var/log/nginx/access.log && tail -F /var/log/nginx/access.log']
      volumeMounts:
        - name: log-volume
          mountPath: /var/log/nginx
  containers:
    - name: web-app
      image: nginx:1.30-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: log-volume
          mountPath: /var/log/nginx
  volumes:
    - name: log-volume
      emptyDir: {}
