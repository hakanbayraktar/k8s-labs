apiVersion: v1
kind: Pod
metadata:
  name: data-pod-2
spec:
  containers:
    - name: app
      image: alpine:3.24
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: app-data
