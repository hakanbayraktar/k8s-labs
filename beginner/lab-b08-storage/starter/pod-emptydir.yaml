apiVersion: v1
kind: Pod
metadata:
  name: shared-volume-pod
spec:
  containers:
    - name: writer
      image: alpine:3.24
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            echo "<h1>Guncel zaman: $(date)</h1>" > /html/index.html
            sleep 2
          done
      volumeMounts:
        - name: shared-html
          mountPath: /html
    - name: web
      image: nginx:1.30-alpine
      volumeMounts:
        - name: shared-html
          mountPath: /usr/share/nginx/html
          readOnly: true
  volumes:
    - name: shared-html
      emptyDir: {}
