apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  labels:
    app: devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
        - name: app
          image: devops-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # ConfigMap ve Secret'taki tum anahtarlar ortam degiskeni olur.
          envFrom:
            - configMapRef:
                name: devops-app-config
            - secretRef:
                name: devops-app-secret
          # Dosya olarak baglanan ConfigMap degisince dosya da guncellenir.
          volumeMounts:
            - name: app-settings
              mountPath: /etc/devops-app
              readOnly: true
      volumes:
        - name: app-settings
          configMap:
            name: app-settings
