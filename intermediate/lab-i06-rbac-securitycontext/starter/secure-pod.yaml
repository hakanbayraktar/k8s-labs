apiVersion: v1
kind: Pod
metadata:
  name: secure-pod
spec:
  securityContext:
    runAsNonRoot: true          # root olarak calismayi reddet
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault      # tehlikeli sistem cagrilarini engelle
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true   # kok dosya sistemi salt-okunur
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp              # yazilabilir tek yer
  volumes:
    - name: tmp
      emptyDir: {}
