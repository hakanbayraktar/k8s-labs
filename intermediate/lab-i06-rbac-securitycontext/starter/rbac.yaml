# Kimlik: Pod'larin kullanacagi ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader
---
# Izinler: bu namespace'teki Pod'lari ve loglarini okuma
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
# Baglanti: kimlige izinleri ver
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader
subjects:
  - kind: ServiceAccount
    name: pod-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
