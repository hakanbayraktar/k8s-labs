apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolling
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1           # Ayni anda en fazla 1 fazla Pod
      maxUnavailable: 0     # Hazir Pod sayisi hicbir an 3'un altina dusmez
  selector:
    matchLabels:
      app: rolling
  template:
    metadata:
      labels:
        app: rolling
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: devops-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:   # Yeni Pod cevap vermeden trafik almaz
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          lifecycle:
            preStop:        # Kapanmadan once 5 sn bekle: Service bu surede Pod'u trafikten cikarir
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: rolling
spec:
  selector:
    app: rolling
  ports:
    - port: 80
      targetPort: http
