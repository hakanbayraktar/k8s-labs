apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
spec:
  replicas: 2
  selector:
    matchLabels: { app: shop, version: blue }
  template:
    metadata:
      labels: { app: shop, version: blue }
    spec:
      containers:
        - name: app
          image: devops-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: app-blue
spec:
  selector: { app: shop, version: blue }
  ports:
    - port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
spec:
  replicas: 2
  selector:
    matchLabels: { app: shop, version: green }
  template:
    metadata:
      labels: { app: shop, version: green }
    spec:
      containers:
        - name: app
          image: devops-app:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: app-green
spec:
  selector: { app: shop, version: green }
  ports:
    - port: 80
      targetPort: http
