# Iki surum de kuralin arkasinda; trafigi agirliklar belirler.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
spec:
  parentRefs:
    - name: shop-gateway
  hostnames:
    - __APP_HOST__
  rules:
    - backendRefs:
        - name: app-blue
          port: 80
          weight: 100
        - name: app-green
          port: 80
          weight: 0
