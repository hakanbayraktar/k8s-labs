# Basliga gore canary: "X-Canary: true" gonderen istekler yeni surume, digerleri eski surume.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
spec:
  parentRefs:
    - name: shop-gateway
  hostnames:
    - __APP_HOST__
  rules:
    - matches:
        - headers:
            - name: X-Canary
              value: "true"
      backendRefs:
        - name: app-green
          port: 80
    - backendRefs:
        - name: app-blue
          port: 80
