apiVersion: apps/v1
kind: Deployment
metadata:
  name: recreate
spec:
  replicas: 2
  strategy:
    type: Recreate          # Once tum eski Pod'lar kapanir, sonra yeniler acilir
  selector:
    matchLabels:
      app: recreate
  template:
    metadata:
      labels:
        app: recreate
    spec:
      containers:
        - name: app
          image: devops-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: recreate
spec:
  selector:
    app: recreate
  ports:
    - port: 80
      targetPort: http
