apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: probe-app
  template:
    metadata:
      labels:
        app: probe-app
    spec:
      containers:
        - name: app
          image: devops-app:1.0
          imagePullPolicy: IfNotPresent
          # Yavas acilan bir uygulamayi taklit eder: 15 sn hazirlik yapar, sonra calisir.
          # /tmp/ready ve /tmp/alive dosyalari probe'lari elle bozabilmek icindir.
          command: ["sh", "-c", "echo hazirlaniyor; sleep 15; touch /tmp/ready /tmp/alive; exec node server.js"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:            # Uygulama cevap verene kadar diger probe'lari bekletir
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 20   # en fazla 40 sn acilis suresi
          readinessProbe:          # Basarisizsa Pod Service'ten cikarilir
            exec:
              command: ["sh", "-c", "test -f /tmp/ready && wget -qO- http://127.0.0.1:8080/healthz"]
            periodSeconds: 3
            failureThreshold: 1
          livenessProbe:           # Basarisizsa container yeniden baslatilir
            exec:
              command: ["test", "-f", "/tmp/alive"]
            periodSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: probe-app
spec:
  selector:
    app: probe-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: client
spec:
  containers:
    - name: shell
      image: busybox:1.37
      command: ["sleep", "3600"]
