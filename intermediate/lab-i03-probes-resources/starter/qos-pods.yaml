apiVersion: v1
kind: Pod
metadata:
  name: qos-guaranteed
  labels:
    demo: qos
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: 100m, memory: 64Mi }
        limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-burstable
  labels:
    demo: qos
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: 50m, memory: 32Mi }
        limits: { memory: 128Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-besteffort
  labels:
    demo: qos
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
