apiVersion: v1
kind: LimitRange
metadata:
  name: container-limits
spec:
  limits:
    - type: Container
      defaultRequest:      # Kaynak yazmayan container'a eklenen request
        cpu: 100m
        memory: 64Mi
      default:             # Kaynak yazmayan container'a eklenen limit
        cpu: 200m
        memory: 128Mi
      max:                 # Tek container bundan fazlasini isteyemez
        cpu: "1"
        memory: 512Mi
