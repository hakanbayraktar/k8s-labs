apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread-app
spec:
  replicas: 2
  selector:
    matchLabels: { app: spread-app }
  template:
    metadata:
      labels: { app: spread-app }
    spec:
      affinity:
        podAntiAffinity:
          # Ayni node'da bu uygulamanin ikinci kopyasi olamaz
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: spread-app }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: nginx:1.30-alpine
          resources:
            requests: { cpu: 25m, memory: 16Mi }
