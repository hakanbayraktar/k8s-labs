apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssd-app
spec:
  replicas: 2
  selector:
    matchLabels: { app: ssd-app }
  template:
    metadata:
      labels: { app: ssd-app }
    spec:
      nodeSelector:
        disk: ssd                 # yalnizca bu etiketi tasiyan node'lara yerles
      containers:
        - name: web
          image: nginx:1.30-alpine
          resources:
            requests: { cpu: 25m, memory: 16Mi }
